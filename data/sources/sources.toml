# Source files the repository uses but does not carry in git.
#
#   .venv/bin/python3 scripts/fetch_sources.py status    # what is here, what is missing
#   .venv/bin/python3 scripts/fetch_sources.py fetch     # download it
#
# Everything else under data/sources/, data/bible/, data/conjugation/ and
# data/words/ is in git. After editing this file run `scripts/fetch_sources.py gitignore`, which
# rewrites the generated block of .gitignore so that git ignores exactly the
# paths listed here. CONTRIBUTING.md says when a file goes here and when in git.
#
# [[file]]     one download. `url` is pinned (a dated dump, a commit, an
#              archive.org file); `fallback` is tried when it has gone.
#              `unpack` names the compression of the download; `size` and
#              `sha256` are of the file on disk, after unpacking.
# [[pages]]    page images archive.org renders one at a time: `n` lists the pages.
# [[git]]      a checkout at a pinned commit.
# [[derived]]  rebuilt by `command`, not downloaded.
# [[local]]    may not be published; `obtain` says where it came from.
#
# `licence` is the rights basis as the source states it; the SOURCES notes
# beside each folder give the detail.
#
# What cannot be fetched again as it was (the dumps whose dated URL has gone,
# the [[local]] files, and git-ignored data this file does not list) is in the
# 2026-10-30 release of the private repository juleshenry/vulgultra-backup:
# https://github.com/juleshenry/vulgultra-backup/releases/tag/2026-10-30
# Download an archive's pieces, then in the repository's root run
# `cat NAME.tar.zst.* | zstd -d | tar -xf -`; manifest.tsv gives each piece's SHA-256.


