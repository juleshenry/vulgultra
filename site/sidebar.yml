# The lesson tree, in sidebar order. It mirrors the tree of apprendeneolatino.com
# (scripts/scrape_apprendeneolatino.py prints the original); titles that named
# Neolatin's own words are made neutral.
#
# Numbers are not written here: a numbered category gets the next number, its
# lessons get N.1, N.2, ... and a lesson's second-level headings N.M.1, ...
#
# A lesson's body is site/content/lessons/<dir>/<slug>.md. Until that file
# exists the page says it is under construction. `done: true` marks a lesson
# as finished (a check mark after its title); `es:` is its Spanish title.

lessons:
  - title: Introduction
    es: Introducción
    dir: introduction
    numbered: false
    lessons:
      - {slug: history, title: A History of Vulgultra}
      - {slug: criteria, title: Design Criteria}
      - {slug: comparisons, title: Comparisons to Other Languages}
