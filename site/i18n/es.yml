# Spanish wording for the site's own text.
#
# `strings` maps an English label to Spanish; a label that is not listed
# stays in English. `site` overrides values of site.yml, in the same shape.
# A page with no translated body under i18n/es/ (same path as in content/)
# shows the English one.

site:
  title: Aprende Vulgultra
  description: >-
    Un sitio web gratuito para aprender vulgultra, la lengua construida que
    recorre en sentido inverso el proceso del latín vulgar.
  copyright: Aprende Vulgultra
  home:
    title: ¡Bienvenido! 👋
    subtitle: >-
      Bienvenido a Aprende Vulgultra, un sitio web gratuito para aprender
      vulgultra, la lengua construida que recorre en sentido inverso el
      proceso del latín vulgar.
    button: {label: ¡Aprende ya!}
    features:
      - title: Tan corto como lo atestiguado
        text: >-
          Cada palabra toma la forma más corta que atestiguan las lenguas
          romances, contada en sílabas.
      - title: Solo las hijas
        text: >-
          Cada palabra viene de una de 36 lenguas romances, en nueve ramas.
          El latín es el proceso que se invierte, no una fuente.
      - title: Abierto
        text: >-
          La gramática, las listas de palabras y la evidencia de cada
          elección son públicas.

